[project]
name = "carrosseis-infinitos-backend"
version = "0.1.0"
description = "Backend FastAPI para geração e renderização de carrosséis e stories"
authors = [{ name = "Gustavo Fonseca", email = "gustavo@usearchflow.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "openai>=1.14.0",
    "playwright>=1.43.0",
    "aiofiles>=23.2.1",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"
