<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="cta.css">
</head>
<body>
<div class="slide cta-v1">
  <img data-slot="image" class="img-cover" src="../../assets/images/placeholder.jpg" alt="">
  <div class="overlay-dark"></div>
  <div class="content content--center inverted">
    <h2 data-slot="headline" class="headline clamp-2">Gostou do conteúdo?</h2>
    <div class="divider"></div>
    <p data-slot="cta" class="cta-text">Salve, compartilhe e siga para mais</p>
    <p data-slot="subcta" class="subcta">Conteúdo novo toda semana</p>
    <span data-slot="signature" class="signature">@seuhandle</span>
  </div>
</div>
</body>
</html>
