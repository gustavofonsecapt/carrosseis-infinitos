<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide story story-v2">
  <div class="content content--between">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="number" class="number">5 / 10</span>
    </div>
    <div class="image-hero" style="margin-top:32px">
      <img data-slot="image" src="../../assets/images/placeholder.jpg" alt="">
    </div>
    <div style="margin-top:36px;display:flex;flex-direction:column;gap:20px;flex:0">
      <span data-slot="kicker" class="kicker">Passo 5</span>
      <h1 data-slot="title" class="title title--sm">Crie um calendário editorial simples</h1>
      <p data-slot="subtitle" class="subtitle">Três posts por semana já fazem diferença quando são consistentes.</p>
      <div class="rule"></div>
      <p data-slot="body" class="body-text" style="font-size:2.6rem">Documente seus pilares e formatos num único lugar acessível.</p>
    </div>
    <span data-slot="footer_note" class="footer-note">Deslize para cima ↑</span>
  </div>
</div>
</body>
</html>
