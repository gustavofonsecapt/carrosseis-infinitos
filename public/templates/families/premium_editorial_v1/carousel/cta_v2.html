<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide cta-v2">
  <img data-slot="image" class="cta-v2-image" src="../../assets/images/placeholder.jpg" alt="">
  <div class="content">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="category" class="category">Categoria</span>
    </div>
    <div class="cta-content">
      <span data-slot="kicker" class="kicker">Último passo</span>
      <h2 data-slot="cta_title" class="title">Quer o material completo?</h2>
      <p data-slot="cta_body" class="body-text" style="color:var(--muted)">Comente "QUERO" que te envio o guia em PDF com todos os passos detalhados e templates prontos para usar.</p>
      <span data-slot="cta_button" class="cta-button">Comentar QUERO</span>
    </div>
    <span data-slot="footer_note" class="footer-note" style="text-align:center;display:block">Link na bio para mais recursos</span>
  </div>
</div>
</body>
</html>
