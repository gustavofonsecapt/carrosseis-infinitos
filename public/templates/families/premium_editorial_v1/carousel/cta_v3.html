<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide cta-v3">
  <img data-slot="image" class="img-cover" src="../../assets/images/placeholder.jpg" alt="">
  <div class="overlay overlay--dark"></div>
  <div class="content content--between">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="category" class="category">Categoria</span>
      <span data-slot="brand" class="brand">petriafonseca.com</span>
    </div>
    <div class="cta-v3__center-block">
      <h2 data-slot="cta_title" class="title title--lg" style="text-align:center;max-width:100%">Título de conclusão impactante</h2>
    </div>
    <div class="cta-v3__bottom-block">
      <p data-slot="cta_body" class="subtitle" style="text-align:center">Subtítulo complementar do CTA</p>
      <span data-slot="cta_button" class="cta-link">Link de ação →</span>
    </div>
  </div>
</div>
</body>
</html>
