<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide dark cover-v3">
  <img data-slot="image" class="img-cover" src="../../assets/images/placeholder.jpg" alt="">
  <div class="overlay overlay--dark"></div>
  <div class="content content--between">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="category" class="category">Categoria</span>
    </div>
    <div class="title-block" style="margin-top:auto;padding-bottom:24px">
      <span data-slot="kicker" class="kicker" style="color:var(--accent)">Série especial</span>
      <h1 data-slot="title" class="title title--lg">Como construir uma marca memorável do zero</h1>
      <div class="rule rule--accent"></div>
      <p data-slot="subtitle" class="subtitle">8 passos práticos para começar hoje.</p>
    </div>
    <div class="bottom-row">
      <span data-slot="footer_note" class="footer-note">Deslize para continuar →</span>
      <span data-slot="number" class="number">01/08</span>
    </div>
  </div>
</div>
</body>
</html>
