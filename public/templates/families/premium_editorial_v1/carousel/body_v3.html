<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide body-v3 theme-dark">
  <div class="content content--between">
    <div class="body-v3__header">
      <span data-slot="category" class="category">categoria</span>
      <span data-slot="brand" class="brand">petriafonseca.com</span>
    </div>
    <div class="body-v3__text-top">
      <p data-slot="body" class="body-text body-text--lg">Texto principal do slide com conteúdo editorial. Pode ser um parágrafo que ocupa a parte superior do card. <strong>Destaque em negrito</strong></p>
    </div>
    <div class="body-v3__image-card">
      <img data-slot="image" src="../../assets/images/placeholder.jpg" alt="" class="img-card" style="width:100%;height:100%;object-fit:cover">
    </div>
    <div class="body-v3__text-bottom">
      <h2 data-slot="title" class="title title--sm"><strong>Título abaixo da imagem</strong> com continuação do texto</h2>
      <p data-slot="subtitle" class="subtitle">Subtítulo complementar abaixo</p>
    </div>
  </div>
</div>
</body>
</html>
