<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="body.css">
</head>
<body>
<div class="slide body-v3">
  <div class="image-fill">
    <img data-slot="image" src="../../assets/images/placeholder.jpg" alt="">
  </div>
  <div class="text-panel">
    <span data-slot="kicker" class="kicker">Insight</span>
    <h2 data-slot="headline" class="headline headline--sm clamp-2">Consistência vale mais que perfeição</h2>
    <div class="divider"></div>
    <p data-slot="body" class="body clamp-4">Publicar regularmente com qualidade razoável supera esperar pela peça perfeita. O algoritmo recompensa presença e o público valoriza constância.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:20px">
      <span data-slot="page_counter" class="page-counter">4 / 8</span>
    </div>
  </div>
</div>
</body>
</html>
