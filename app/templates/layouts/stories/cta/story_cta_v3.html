<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="story_cta.css">
</head>
<body>
<div class="slide story-cta-v3 inverted">
  <img data-slot="image" class="img-cover" src="../../assets/images/placeholder.jpg" alt="">
  <div class="overlay-dark" style="background:linear-gradient(180deg, rgba(20,20,20,0.1) 0%, rgba(20,20,20,0.45) 100%)"></div>
  <div class="content content--center" style="padding-top:220px;padding-bottom:300px;align-items:center;text-align:center">
    <h1 data-slot="headline" class="headline clamp-2">Não perca essa oportunidade</h1>
    <p data-slot="cta" class="cta-text">Manda um DM com:</p>
    <span data-slot="trigger_word" class="trigger">QUERO</span>
    <span data-slot="signature" class="signature">@seuhandle</span>
  </div>
</div>
</body>
</html>
