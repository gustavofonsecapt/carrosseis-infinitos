<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide body-v2">
  <div class="content content--between">
    <div class="body-v2__header">
      <span data-slot="category" class="category">categoria</span>
      <span data-slot="brand" class="brand">petriafonseca.com</span>
    </div>
    <div class="body-v2__text-top">
      <p data-slot="body" class="body-text body-text--lg">Texto principal do slide com conteúdo editorial. Pode ser um parágrafo longo que ocupa a parte superior do card. <strong>Destaque em negrito</strong></p>
    </div>
    <div class="body-v2__image-zone">
      <img data-slot="image" class="img-cover" src="../../assets/images/placeholder.jpg" alt="">
      <div class="body-v2__image-scrim"></div>
      <div class="body-v2__image-text">
        <div class="body-v2__arrow-icon">➜</div>
        <h2 data-slot="title" class="title title--sm" style="color:#fff"><strong>Título sobre a imagem</strong></h2>
        <p data-slot="subtitle" class="subtitle" style="color:rgba(255,255,255,0.8)">Texto complementar sobre a imagem com scrim para legibilidade</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
