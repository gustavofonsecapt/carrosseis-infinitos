<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide body-v2">
  <div class="content content--between">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="category" class="category">Categoria</span>
      <span data-slot="number" class="number">04/08</span>
    </div>
    <div class="image-hero" style="margin-top:32px">
      <img data-slot="image" src="../../assets/images/placeholder.jpg" alt="">
    </div>
    <div class="caption-block">
      <span data-slot="kicker" class="kicker">Passo 4</span>
      <h2 data-slot="title" class="title title--sm">Crie um calendário editorial simples</h2>
      <div class="rule"></div>
      <ul data-slot="bullets" class="bullets">
        <li>Mapeie os pilares de conteúdo do mês</li>
        <li>Defina formatos para cada pilar</li>
        <li>Reserve um dia para produção em lote</li>
        <li>Revise performance toda sexta-feira</li>
      </ul>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="footer_note" class="footer-note">Deslize →</span>
    </div>
  </div>
</div>
</body>
</html>
