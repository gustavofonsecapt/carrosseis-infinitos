<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide cover-v1">
  <div class="content content--between">
    <div class="header-row">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="number" class="number">01/08</span>
    </div>
    <div class="title-block">
      <span data-slot="category" class="category">Categoria</span>
      <div class="gap-sm"></div>
      <span data-slot="kicker" class="kicker">Série especial</span>
      <h1 data-slot="title" class="title title--lg">5 estratégias que transformam resultados em 30 dias</h1>
      <div class="rule rule--accent"></div>
      <p data-slot="subtitle" class="subtitle">Um guia editorial para quem busca consistência e crescimento real.</p>
    </div>
    <div data-slot="image" class="image-card-zone">
      <img src="../../assets/images/placeholder.jpg" alt="">
    </div>
    <span data-slot="footer_note" class="footer-note">Deslize para continuar →</span>
  </div>
</div>
</body>
</html>
