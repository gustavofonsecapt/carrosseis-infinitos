<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide cover-v3">
  <img data-slot="image" class="img-cover" src="../../assets/images/placeholder.jpg" alt="">
  <div class="overlay overlay--dark"></div>
  <div class="content content--between">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="category" class="category">Categoria</span>
      <span data-slot="brand" class="brand">petriafonseca.com</span>
    </div>
    <div class="cover-v3__center-block">
      <h1 data-slot="title" class="title title--xl">Título gerado por IA ou Redline</h1>
    </div>
    <div class="cover-v3__bottom-block">
      <p data-slot="subtitle" class="subtitle" style="text-align:center">Subtítulo complementar do conteúdo</p>
      <span data-slot="cta_button" class="cta-link">Leia mais →</span>
    </div>
  </div>
</div>
</body>
</html>
