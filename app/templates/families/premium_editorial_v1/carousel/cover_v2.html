<!DOCTYPE html>
<html lang="pt-BR">

</head>
<body>
<div class="slide cover-v2">

      <span data-slot="kicker" class="kicker">Série especial</span>

      <div class="gap-sm"></div>

        <span data-slot="footer_note" class="footer-note">Deslize para continuar →</span>

    </div>
