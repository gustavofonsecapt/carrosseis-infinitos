<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide dark body-v3">
  <div class="content content--between">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="number" class="number">05/08</span>
    </div>
    <div class="text-block">
      <span data-slot="kicker" class="kicker" style="color:var(--accent)">Insight</span>
      <div class="gap-xs"></div>
      <h2 data-slot="title" class="title">A maioria desiste cedo demais</h2>
      <div class="rule rule--accent"></div>
      <p data-slot="body" class="body-text">Resultados reais em conteúdo editorial exigem pelo menos 90 dias de consistência. A maioria das marcas desiste antes de completar o primeiro mês.</p>
      <div class="gap-md"></div>
      <p data-slot="subtitle" class="subtitle" style="font-style:italic;border-left:3px solid var(--accent);padding-left:24px">"Persistência vence talento quando talento não persiste."</p>
    </div>
    <span data-slot="footer_note" class="footer-note">Deslize para continuar →</span>
  </div>
</div>
</body>
</html>
