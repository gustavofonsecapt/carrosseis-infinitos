<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide cta-v3">
  <div class="content">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="number" class="number">08/08</span>
    </div>
    <div class="cta-content">
      <div class="accent-pill" data-slot="kicker">Exclusivo</div>
      <h2 data-slot="cta_title" class="title">Pronto para o próximo nível?</h2>
      <div class="rule rule--accent"></div>
      <p data-slot="cta_body" class="body-text">Siga para receber conteúdo editorial premium toda semana. Transforme conhecimento em resultado real.</p>
      <span data-slot="cta_button" class="cta-button">Seguir agora</span>
    </div>
    <span data-slot="footer_note" class="footer-note" style="text-align:center;display:block">@petriafonseca · conteúdo semanal</span>
  </div>
</div>
</body>
</html>
