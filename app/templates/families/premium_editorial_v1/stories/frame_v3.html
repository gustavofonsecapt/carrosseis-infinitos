<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../variants.css">
</head>
<body>
<div class="slide story dark story-v3">
  <img data-slot="image" class="img-cover" src="../../assets/images/placeholder.jpg" alt="">
  <div class="overlay overlay--dark"></div>
  <div class="content content--between">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span data-slot="brand" class="brand">petriafonseca.com</span>
      <span data-slot="number" class="number">7 / 10</span>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:24px;padding-bottom:24px">
      <span data-slot="category" class="category">Categoria</span>
      <span data-slot="kicker" class="kicker" style="color:var(--accent)">Insight</span>
      <h1 data-slot="title" class="title">Como construir uma marca memorável do zero</h1>
      <div class="rule rule--accent"></div>
      <p data-slot="subtitle" class="subtitle">A autenticidade é o único diferencial que não pode ser copiado.</p>
      <p data-slot="body" class="body-text" style="font-size:2.6rem">Invista tempo em entender sua voz antes de investir em volume de publicação.</p>
    </div>
    <span data-slot="footer_note" class="footer-note">Deslize para cima ↑</span>
  </div>
</div>
</body>
</html>
